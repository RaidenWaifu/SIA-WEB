<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Success</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="result-page" id="result" data-cy="result">
    <h1>Checking your payment…</h1>
    <p>Please wait a moment.</p>
</main>

<script>
const API_BASE = "http://localhost:8080/api";

const params = new URLSearchParams(window.location.search);
const orderCode = params.get("order");
const resultEl = document.getElementById("result");

async function verify() {
    if (!orderCode) {
        resultEl.innerHTML = "<h1>Missing order code</h1><p><a href='index.html'>Back to store</a></p>";
        return;
    }
    try {
        const res = await fetch(`${API_BASE}/orders/${orderCode}/verify`);
        const order = await res.json();

        if (order.status === "paid") {
            resultEl.innerHTML = `
                <h1>✅ Payment received</h1>
                <p>Order <strong>${orderCode}</strong> is now marked as <strong>paid</strong>.</p>
                <p><a href="index.html">&larr; Back to store</a></p>`;
        } else {
            resultEl.innerHTML = `
                <h1>⚠️ Payment not yet confirmed</h1>
                <p>Order <strong>${orderCode}</strong> status: <strong>${order.status}</strong>.
                If you just paid, wait a moment and refresh this page.</p>
                <p><a href="index.html">&larr; Back to store</a></p>`;
        }
    } catch (e) {
        resultEl.innerHTML = "<h1>Could not verify payment</h1><p>Is the Spring Boot backend running?</p>";
    }
}

verify();
</script>
</body>
</html>
